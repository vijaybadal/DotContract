# Local / demonstration stack: PostgreSQL, one-off migrate+seed, web app, hourly jobs.
#   cp .env.example .env   # then set SESSION_SECRET and STORAGE_KEY
#   docker compose up --build
# Demo mode (account picker + e-signature mock) is enabled explicitly below. Never use these
# settings on a server that holds real contracts.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clm
      POSTGRES_PASSWORD: clm-local-only
      POSTGRES_DB: clm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clm"]
      interval: 5s
      retries: 20

  migrate:
    build: .
    command: ["sh", "-c", "npx tsx scripts/migrate.ts && (test \"$SEED_DEMO\" = true && npx tsx scripts/seed.ts || true)"]
    env_file: .env
    environment: &appenv
      DATABASE_URL: postgresql://clm:clm-local-only@db:5432/clm
      STORAGE_DIR: /data/storage
      SEED_DEMO: "true"
    volumes: [storage:/data/storage]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  app:
    build: .
    env_file: .env
    environment:
      <<: *appenv
      AUTH_MODE: dev
      ALLOW_DEMO_LOGIN: "true"
      ESIGN_PROVIDER: mock
      ALLOW_MOCK_ESIGN: "true"
      APP_BASE_URL: http://localhost:3000
    ports: ["3000:3000"]
    volumes: [storage:/data/storage]
    depends_on: { migrate: { condition: service_completed_successfully } }

  jobs:
    build: .
    command: ["sh", "-c", "while true; do npx tsx scripts/run-jobs.ts; sleep 3600; done"]
    env_file: .env
    environment:
      <<: *appenv
      ALLOW_MOCK_ESIGN: "true"
    volumes: [storage:/data/storage]
    depends_on: { migrate: { condition: service_completed_successfully } }

volumes:
  pgdata: {}
  storage: {}
